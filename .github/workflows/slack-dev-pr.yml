name: Notify Slack for dev branch PRs

on:
  pull_request:
    branches:
      - dev

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Send notification to Slack
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data '{"text":"Pull request opened by <${{ github.event.pull_request.user.html_url }}|${{ github.event.pull_request.user.login }}>\n> *Title:* <${{ github.event.pull_request.html_url }}|${{ github.event.pull_request.title }}>\n> *URL:* <${{ github.event.pull_request.html_url }}>"}' \
          ${{ secrets.SLACK_WEBHOOK_URL }}